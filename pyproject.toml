[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sponge"
version = "0.1.0"
description = "Voice-first agentic UI for personal knowledge graphs. Whisper local + propose-approve-commit + mobile Jazz interface."
readme = "README.md"
license = "MIT"
authors = [{name = "Addo-Kwabena Addo", email = "akaddo97@users.noreply.github.com"}]
requires-python = ">=3.11"
keywords = [
    "voice",
    "agentic-ui",
    "knowledge-graph",
    "whisper",
    "self-hosted",
    "personal",
    "ios",
    "macos",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Flask",
]
dependencies = [
    "flask>=3.1.3",
    # Sponge vendors `llm_providers` (until that package is on PyPI), which
    # reaches for whichever provider SDK is configured at runtime.
    "anthropic>=0.115.0",
    "google-genai>=2.6.0",
    "openai>=2.41.0",
    # Voice pipeline is core — without Whisper, Sponge is just a chatbot UI.
    "pywhispercpp>=1.5.0",
]

[project.optional-dependencies]
# `whisper` extras retained as a no-op alias — pywhispercpp now in core deps.
whisper = ["pywhispercpp>=1.5.0"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/akaddo97/sponge"
Issues = "https://github.com/akaddo97/sponge/issues"

[project.scripts]
sponge = "sponge.app:main"
sponge-watcher = "sponge.voice_watcher:main"

[tool.hatch.build]
packages = ["src/sponge"]

[tool.hatch.build.targets.wheel]
include = [
    "src/sponge/**/*.py",
    "templates/**/*.html",
    "static/**/*.css",
    "static/**/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
